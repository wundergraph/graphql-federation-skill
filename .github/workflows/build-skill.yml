name: Build Skill File

on:
  push:
    branches:
      - main
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'Makefile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y zip unzip

      - name: Build skill file
        run: |
          set -e
          make clean build
          echo "Build completed, file size: $(stat -c%s graphql-federation.skill) bytes"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet graphql-federation.skill; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Close existing PRs
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find and close any open PRs with the automated label
          open_prs=$(gh pr list --label "automated" --state open --json number --jq '.[].number')
          for pr in $open_prs; do
            echo "Closing PR #$pr"
            gh pr close "$pr" --comment "Superseded by a newer build."
          done

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: rebuild graphql-federation.skill'
          title: 'chore: Update graphql-federation.skill'
          body: |
            This PR was automatically generated after changes were merged to main.

            The `graphql-federation.skill` file has been rebuilt from the source files.

            ---
            *This is an automated PR created by the build-skill workflow.*
          branch: chore/update-skill-file
          delete-branch: true
          labels: automated